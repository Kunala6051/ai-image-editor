<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">AI-Powered Image Editing Platform - System Architecture</text>

  <!-- user + UI -->
  <rect x="20" y="60" width="150" height="60" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="95" y="96" text-anchor="middle" fill="#0c4a6e" font-weight="600">User (browser)</text>
  <rect x="230" y="50" width="500" height="120" rx="12" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="480" y="75" text-anchor="middle" fill="#4c1d95" font-weight="700">Streamlit UI  (app.py)</text>
  <rect x="245" y="90" width="150" height="65" rx="8" fill="#fff" stroke="#a78bfa"/>
  <text x="320" y="115" text-anchor="middle" fill="#334155">Library</text>
  <text x="320" y="135" text-anchor="middle" fill="#64748b" font-size="12">upload · search · cards</text>
  <rect x="405" y="90" width="150" height="65" rx="8" fill="#fff" stroke="#a78bfa"/>
  <text x="480" y="115" text-anchor="middle" fill="#334155">Image detail + Edit</text>
  <text x="480" y="135" text-anchor="middle" fill="#64748b" font-size="12">presets · prompt · caption</text>
  <rect x="565" y="90" width="150" height="65" rx="8" fill="#fff" stroke="#a78bfa"/>
  <text x="640" y="115" text-anchor="middle" fill="#334155">Version history</text>
  <text x="640" y="135" text-anchor="middle" fill="#64748b" font-size="12">view · compare · revert</text>
  <line x1="170" y1="90" x2="228" y2="90" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- services -->
  <rect x="40" y="240" width="400" height="150" rx="12" fill="#dcfce7" stroke="#16a34a"/>
  <text x="240" y="265" text-anchor="middle" fill="#14532d" font-weight="700">Editing service  (providers.py + prompts.py)</text>
  <rect x="55" y="280" width="170" height="95" rx="8" fill="#fff" stroke="#4ade80"/>
  <text x="140" y="302" text-anchor="middle" fill="#334155">1. Interpret</text>
  <text x="140" y="322" text-anchor="middle" fill="#64748b" font-size="12">vision LLM turns a casual</text>
  <text x="140" y="338" text-anchor="middle" fill="#64748b" font-size="12">request into a JSON spec</text>
  <text x="140" y="358" text-anchor="middle" fill="#64748b" font-size="12">(feasibility check)</text>
  <rect x="255" y="280" width="170" height="95" rx="8" fill="#fff" stroke="#4ade80"/>
  <text x="340" y="302" text-anchor="middle" fill="#334155">2. Generate</text>
  <text x="340" y="322" text-anchor="middle" fill="#64748b" font-size="12">strict edit template +</text>
  <text x="340" y="338" text-anchor="middle" fill="#64748b" font-size="12">image-edit model</text>
  <text x="340" y="358" text-anchor="middle" fill="#64748b" font-size="12">returns edited image</text>
  <line x1="225" y1="328" x2="253" y2="328" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <rect x="500" y="240" width="420" height="150" rx="12" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="710" y="265" text-anchor="middle" fill="#713f12" font-weight="700">Search service  (search.py)</text>
  <rect x="515" y="280" width="120" height="95" rx="8" fill="#fff" stroke="#facc15"/>
  <text x="575" y="302" text-anchor="middle" fill="#334155">Captioner</text>
  <text x="575" y="322" text-anchor="middle" fill="#64748b" font-size="12">vision LLM writes</text>
  <text x="575" y="338" text-anchor="middle" fill="#64748b" font-size="12">a description</text>
  <rect x="650" y="280" width="120" height="95" rx="8" fill="#fff" stroke="#facc15"/>
  <text x="710" y="302" text-anchor="middle" fill="#334155">Embedder</text>
  <text x="710" y="322" text-anchor="middle" fill="#64748b" font-size="12">caption / query</text>
  <text x="710" y="338" text-anchor="middle" fill="#64748b" font-size="12">to vector</text>
  <rect x="785" y="280" width="120" height="95" rx="8" fill="#fff" stroke="#facc15"/>
  <text x="845" y="302" text-anchor="middle" fill="#334155">Ranker</text>
  <text x="845" y="322" text-anchor="middle" fill="#64748b" font-size="12">cosine similarity</text>
  <text x="845" y="338" text-anchor="middle" fill="#64748b" font-size="12">+ keyword fallback</text>
  <line x1="635" y1="328" x2="648" y2="328" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="770" y1="328" x2="783" y2="328" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <line x1="400" y1="170" x2="300" y2="238" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="560" y1="170" x2="700" y2="238" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- storage -->
  <rect x="40" y="450" width="400" height="110" rx="12" fill="#fee2e2" stroke="#dc2626"/>
  <text x="240" y="475" text-anchor="middle" fill="#7f1d1d" font-weight="700">Image storage  (storage.py)</text>
  <text x="240" y="502" text-anchor="middle" fill="#334155" font-size="13">data/images/&lt;id&gt;/ v0.png (original) v1.png ... thumbs/</text>
  <text x="240" y="524" text-anchor="middle" fill="#334155" font-size="13">meta.json: versions, prompts, timestamps, caption</text>
  <text x="240" y="546" text-anchor="middle" fill="#64748b" font-size="12">atomic writes · sha256 duplicate check · schema upgrade</text>
  <rect x="500" y="450" width="420" height="110" rx="12" fill="#fee2e2" stroke="#dc2626"/>
  <text x="710" y="475" text-anchor="middle" fill="#7f1d1d" font-weight="700">Search index  (data/index.json)</text>
  <text x="710" y="505" text-anchor="middle" fill="#334155" font-size="13">per image: caption, embedding vector, model name</text>
  <text x="710" y="527" text-anchor="middle" fill="#64748b" font-size="12">corruption-safe load · sync on delete</text>
  <line x1="240" y1="392" x2="240" y2="448" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="710" y1="392" x2="710" y2="448" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="440" y1="505" x2="498" y2="505" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- external -->
  <text x="480" y="416" text-anchor="middle" fill="#475569" font-size="12">External APIs (swappable): Gemini (vision, text, embeddings; free tier) · OpenAI (optional)</text>
  <text x="480" y="434" text-anchor="middle" fill="#475569" font-size="12">Hugging Face Space running FLUX.1 Kontext (image editing; free)</text>
</svg>
